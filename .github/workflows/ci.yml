name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set environment to avoid model downloads
        run: |
          echo "HF_HUB_OFFLINE=1" >> $GITHUB_ENV
          echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV
          echo "MKL_NUM_THREADS=1" >> $GITHUB_ENV

      - name: Lint (optional)
        run: |
          # If you use ruff/flake8 - adapt to your config
          ruff check .

      - name: Run unit tests (fast only)
        env:
          APP_ENV: production
          REDIS_URL: redis://localhost:6379/0
        run: |
          # Skip tests marked as integration. Ensure heavy tests are marked.
          pytest -q -m "not integration" --maxfail=1
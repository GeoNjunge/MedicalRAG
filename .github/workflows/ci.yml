name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set environment to avoid model downloads
        run: |
          echo "HF_HUB_OFFLINE=1" >> $GITHUB_ENV
          echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV
          echo "MKL_NUM_THREADS=1" >> $GITHUB_ENV

      - name: Lint (optional)
        run: |
          # If you use ruff/flake8 - adapt to your config
          ruff check .

      - name: Run unit tests (fast only)
        env:
          APP_ENV: dev
          DATABASE_URL: sqlite:///:memory:
          S3_BUCKET_URL: http://test
          S3_BUCKET_NAME: test
          AWS_ACCESS_KEY: test
          AWS_SECRET_KEY: test
          S3_REGION_NAME: us-east-1
          OLLAMA_URL: http://localhost:11434
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: apps/api:ml_core/src
        run: |
          pytest apps/api/app/tests/test_upload.py -q --maxfail=1

      - name: Verify Docker image builds
        run: docker build -f infra/docker/Dockerfile -t clinical-ai .
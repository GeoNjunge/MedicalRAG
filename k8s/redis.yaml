apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: medicalrag
  labels:
    app: redis
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: data
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: medicalrag
  labels:
    app: redis
    tier: data
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

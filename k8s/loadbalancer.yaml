apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadbalancer
  namespace: medicalrag
  labels:
    app: loadbalancer
    tier: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadbalancer
  template:
    metadata:
      labels:
        app: loadbalancer
        tier: edge
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer
  namespace: medicalrag
  labels:
    app: loadbalancer
    tier: edge
spec:
  type: NodePort
  selector:
    app: loadbalancer
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

apiVersion: v1
kind: ConfigMap
metadata:
  name: medicalrag-config
  namespace: medicalrag
data:
  MEDICALRAG_ROOT: "/app"
  HOST: "0.0.0.0"
  PORT: "10000"
  WORKERS: "1"
  APP_ENV: "production"
  WORKER_APP_ENV: "dev"
  SIM_BUDGET_GIB: "6.5"
  SIM_MAX_RQ_WORKERS: "1"
  REDIS_URL: "redis://redis:6379/0"
  DATABASE_URL: "postgresql+psycopg://medicalrag:medicalrag@postgres:5432/medicalrag"
  BACKEND_URL: "http://loadbalancer:8080"
  FRONTEND_URL: "http://localhost:4200"
  S3_BUCKET_URL: ""
  S3_BUCKET_NAME: ""
  AWS_ACCESS_KEY: ""
  AWS_SECRET_KEY: ""
  S3_REGION_NAME: ""
  OLLAMA_URL: "http://localhost:11434"
  HF_HUB_OFFLINE: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "1"

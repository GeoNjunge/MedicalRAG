<nav
  style="background:rgba(14,15,17,0.9); border-bottom:1px solid #2a2e38;"
  class="sticky top-0 z-40 backdrop-blur-xl">

  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-[60px]">

    <!-- Logo -->
    <div class="flex items-center gap-2.5">
      <div
        style="background:linear-gradient(135deg,#c45e2a,#e8703a);"
        class="w-[34px] h-[34px] rounded-[9px] flex items-center justify-center flex-shrink-0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v11m0
                   0H5a2 2 0 00-2 2v2a2 2 0 002 2h14a2 2 0 002-2v-2a2 2
                   0 00-2-2H9m0 0v-4"/>
        </svg>
      </div>

      <span
        style="background:linear-gradient(135deg,#ff8c52,#ffb347);
               -webkit-background-clip:text; -webkit-text-fill-color:transparent;
               background-clip:text;"
        class="font-[Syne] text-[24px] font-extrabold tracking-tight">
        MedNLP
      </span>

      <span
        style="border:1px solid #2a2e38; color:#555b6b;"
        class="font-mono text-[10px] px-1.5 py-0.5 rounded">
        v2.1
      </span>
    </div>

    <!-- Nav Tabs -->
    <div class="flex items-center">
      <a
        routerLink="/"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        #homeLink="routerLinkActive"
        [style.color]="homeLink.isActive ? '#e8703a' : '#8b909e'"
        [style.borderBottom]="homeLink.isActive ? '2px solid #e8703a' : '2px solid transparent'"
        class="px-[22px] py-2 bg-transparent border-none font-[Syne]
               text-[14px] font-semibold cursor-pointer tracking-wide
               transition-all duration-200 hover:text-[#e8eaf0] no-underline">
        Overview
      </a>
      <a
        routerLink="/analyze"
        routerLinkActive="active-tab"
        #analyzeLink="routerLinkActive"
        [style.color]="analyzeLink.isActive ? '#e8703a' : '#8b909e'"
        [style.borderBottom]="analyzeLink.isActive ? '2px solid #e8703a' : '2px solid transparent'"
        class="px-[22px] py-2 bg-transparent border-none font-[Syne]
               text-[14px] font-semibold cursor-pointer tracking-wide
               transition-all duration-200 hover:text-[#e8eaf0] no-underline">
        Analyze
      </a>
      <a
        routerLink="/search"
        routerLinkActive="active-tab"
        #searchLink="routerLinkActive"
        [style.color]="searchLink.isActive ? '#e8703a' : '#8b909e'"
        [style.borderBottom]="searchLink.isActive ? '2px solid #e8703a' : '2px solid transparent'"
        class="px-[22px] py-2 bg-transparent border-none font-[Syne]
               text-[14px] font-semibold cursor-pointer tracking-wide
               transition-all duration-200 hover:text-[#e8eaf0] no-underline">
        Patient Search
      </a>
    </div>

    <!-- Right: status + chat button -->
    <div class="flex items-center gap-3.5">
      <div class="flex items-center gap-1.5">
        <span
          style="background:#3ecf8e; box-shadow:0 0 0 3px rgba(62,207,142,0.2);"
          class="w-2 h-2 rounded-full">
        </span>
        <span style="color:#555b6b;" class="font-mono text-[11px]">API Online</span>
      </div>

      <button
        (click)="chat.open()"
        title="Open Chat Assistant"
        style="background:#1c1f26; border:1px solid #2a2e38;"
        class="relative w-[38px] h-[38px] rounded-[9px] flex items-center
               justify-center cursor-pointer transition-all duration-200
               hover:border-[#e8703a]">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="#e8703a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
        @if (chat.hasDot()) {
          <span
            style="background:#3ecf8e;"
            class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full">
          </span>
        }
      </button>
    </div>

  </div>
</nav>

<div style="background:#16181d; border:1px solid #2a2e38;" class="rounded-2xl p-6">

  <!-- Section title -->
  <div class="flex items-center gap-2 mb-5">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e8703a"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <span style="color:#8b909e;"
          class="font-[Syne] text-[13px] font-bold uppercase tracking-[0.5px]">
      Upload Document
    </span>
  </div>

  <!-- Drop zone -->
  <div
    class="rounded-xl p-8 text-center cursor-pointer mb-4 transition-all duration-300"
    [style.border]="isDragOver ? '2px dashed #e8703a' : '2px dashed #3a3f4d'"
    [style.background]="isDragOver
      ? 'linear-gradient(135deg,rgba(232,112,58,0.08) 0%,transparent 60%)'
      : 'linear-gradient(135deg,rgba(232,112,58,0.03) 0%,transparent 60%)'"
    (click)="fileInput.click()"
    (dragover)="$event.preventDefault(); isDragOver=true"
    (dragleave)="isDragOver=false"
    (drop)="onDrop($event)">

    <input #fileInput type="file" class="hidden"
           accept=".pdf,.txt,.docx,.png,.jpg"
           (change)="onFileInput($event)" />

    @if (!file()) {
      <!-- Placeholder -->
      <div style="background:rgba(232,112,58,0.1);"
           class="w-[50px] h-[50px] rounded-[13px] flex items-center justify-center mx-auto mb-3">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e8703a"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </div>
      <p style="color:#e8eaf0;" class="text-[14px] font-medium m-0 mb-1">
        Drop document here
      </p>
      <p style="color:#555b6b;" class="text-[12px] m-0 mb-2.5">or click to browse files</p>
      <div class="flex justify-center gap-1.5 flex-wrap">
        @for (fmt of ['PDF','DOCX','TXT','PNG/JPG']; track fmt) {
          <span style="background:#0e0f11; border:1px solid #2a2e38; color:#555b6b;"
                class="font-mono text-[10px] px-1.5 py-0.5 rounded">{{ fmt }}</span>
        }
      </div>
    } @else {
      <!-- File selected -->
      <div style="background:rgba(62,207,142,0.1);"
           class="w-10 h-10 rounded-[10px] flex items-center justify-center mx-auto mb-2.5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3ecf8e"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <p style="color:#e8eaf0;" class="text-[13px] font-medium m-0 mb-1 break-all">
        {{ file()!.name }}
      </p>
      <p style="color:#555b6b;" class="font-mono text-[12px] m-0">
        {{ formatBytes(file()!.size) }}
      </p>
    }
  </div>

  <!-- Patient ID -->
  <div class="mb-3.5">
    <label style="color:#8b909e;" class="block text-[12px] font-medium mb-1.5">
      Patient ID
      <span style="color:#555b6b;" class="font-normal">(optional)</span>
    </label>
    <input
      type="text"
      [(ngModel)]="patientId"
      (ngModelChange)="onPatientId($event)"
      placeholder="e.g. PAT-00482"
      style="background:#0e0f11; border:1px solid #2a2e38; color:#e8eaf0;"
      class="w-full rounded-lg px-3 py-2.5 font-mono text-[13px] transition-all duration-200
             focus:outline-none focus:border-[#e8703a]
             focus:shadow-[0_0_0_3px_rgba(232,112,58,0.1)]
             placeholder:text-[#555b6b]" />
  </div>

  <!-- Document type -->
  <div class="mb-5">
    <label style="color:#8b909e;" class="block text-[12px] font-medium mb-2">
      Document Type
    </label>
    <div class="grid grid-cols-2 gap-1.5">
      @for (dt of docTypes; track dt.value) {
        <label
          class="flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer transition-all duration-200"
          [style.background]="'#0e0f11'"
          [style.border]="docType === dt.value ? '1px solid #e8703a' : '1px solid #2a2e38'">
          <input
            type="radio"
            name="docType"
            [value]="dt.value"
            [(ngModel)]="docType"
            (ngModelChange)="onDocType($event)"
            style="accent-color:#e8703a;" />
          <span style="color:#8b909e;" class="text-[12px]">{{ dt.label }}</span>
        </label>
      }
    </div>
  </div>

  <!-- Upload button -->
  <button
    (click)="triggerUpload()"
    [disabled]="!file() || disabled"
    style="background:linear-gradient(135deg,#c45e2a,#e8703a);"
    class="w-full py-3.5 rounded-[10px] font-[Syne] text-[14px] font-bold
           tracking-wide text-white border-none flex items-center justify-center gap-2
           cursor-pointer transition-all duration-200
           hover:brightness-110 hover:-translate-y-px
           hover:shadow-[0_4px_16px_rgba(232,112,58,0.3)]
           disabled:opacity-40 disabled:cursor-not-allowed
           disabled:translate-y-0 disabled:shadow-none disabled:brightness-100">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    {{ disabled ? 'Analyzing…' : 'Analyze Document' }}
  </button>

</div>

<form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-md space-y-4">
  
  <!-- File Input -->
  <div class="form-group">
    <label for="file" class="block text-sm font-medium text-gray-700">Choose File:</label>
    <input type="file" id="file" (change)="onFileChange($event)"
           class="mt-1 block w-full text-sm text-gray-500
                  file:mr-4 file:py-2 file:px-4
                  file:rounded-full file:border-0
                  file:text-sm file:font-semibold
                  file:bg-blue-50 file:text-blue-700
                  hover:file:bg-blue-100">
  </div>

  <!-- Patient ID -->
  <div class="form-group">
    <label for="patient_id" class="block text-sm font-medium text-gray-700">Patient ID:</label>
    <input type="text" id="patient_id" formControlName="patient_id"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
  </div>

  <!-- Model Version -->
  <div class="form-group">
    <label for="model_version" class="block text-sm font-medium text-gray-700">Model Version:</label>
    <input type="text" id="model_version" formControlName="model_version"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
  </div>

  <!-- Priority -->
  <div class="form-group">
    <label for="priority" class="block text-sm font-medium text-gray-700">Priority:</label>
    <input type="text" id="priority" formControlName="priority"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
  </div>

  <!-- Submit Button -->
  <button type="submit" 
          [disabled]="!uploadForm.valid"
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed">
    Upload
  </button>
</form>
